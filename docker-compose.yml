version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campus_infra_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: campus_infra_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_infra_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - campus_infra_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus_infra_backend_dev
    restart: always
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/campus_infra_db?schema=public
      JWT_ACCESS_SECRET: dev_jwt_access_secret_12345
      JWT_REFRESH_SECRET: dev_jwt_refresh_secret_12345
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campus_infra_net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: campus_infra_frontend_dev
    restart: always
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - campus_infra_net

volumes:
  postgres_dev_data:

networks:
  campus_infra_net:
    driver: bridge
