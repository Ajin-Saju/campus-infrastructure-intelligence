name: CI Pipeline

on:
  push:
    branches: [ main, master, "feature/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Build & Validate Monorepo
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/campus_infra_db"
      NEXT_PUBLIC_API_URL: "http://localhost:3001/api/v1"
      NEXT_PUBLIC_WS_URL: "http://localhost:3001"
      JWT_ACCESS_SECRET: "ci-test-jwt-access-secret-key-123"
      JWT_REFRESH_SECRET: "ci-test-jwt-refresh-secret-key-123"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=@campus-infra/database

      - name: Check Code Formatting
        run: npm run format:check

      - name: Run ESLint Across Workspaces
        run: npm run lint

      - name: Validate TypeScript Types
        run: npm run check-types

      - name: Validate Prisma Schema
        run: npx prisma validate --schema=database/prisma/schema.prisma

      - name: Build All Workspaces
        run: npm run build
