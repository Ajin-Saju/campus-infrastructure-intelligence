version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campus_infra_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campus_infra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campus_network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: campus_infra_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/campus_infra_db?schema=public
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    networks:
      - campus_network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: campus_infra_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - campus_network

volumes:
  postgres_data:

networks:
  campus_network:
    driver: bridge
